[project]
name = "nexus-backend"
version = "0.1.0"
description = "NEXUS local AI orchestration studio: backend API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiosqlite>=0.22",
  "alembic>=1.20,<2",
  "cryptography>=44",
  "fastapi>=0.162,<1",
  "httpx>=0.28,<1",
  "keyring>=25",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "litellm==1.106.5",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.1,<2.2",
  "uvicorn>=0.54,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=9,<10", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic

[project.scripts]
nexus-api = "nexus.main:run"
